[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-customer-operations-demo"
version = "0.1.0"
description = "Synthetic demonstration of reliable customer operations automation"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marc Oliver" }]

[tool.setuptools.packages.find]
where = ["src"]

